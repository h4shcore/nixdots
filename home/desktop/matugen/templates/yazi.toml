[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "{{colors.tertiary_container.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
marker_selected = { fg = "{{colors.primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

count_copied = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_cut = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

border_style = { fg = "{{colors.outline.default.hex}}" }

[tabs]
active = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[mode]
normal_main = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

select_main = { bg = "{{colors.error.default.hex}}", fg = "{{colors.on_error.default.hex}}", bold = true }
select_alt = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

unset_main = { bg = "{{colors.tertiary.default.hex}}", fg = "{{colors.on_tertiary.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[indicator]
# padding = { open = "█", close = "█" }

[status]
# sep_left = { open = "█", close = "█" }
# sep_right = { open = "█", close = "█" }
perm_type = { fg = "{{colors.tertiary.default.hex}}" }
perm_read = { fg = "{{colors.secondary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec = { fg = "{{colors.primary.default.hex}}" }

progress_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
progress_error = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }

[which]
mask = { bg = "{{colors.surface_container_high.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
rest = { fg = "{{colors.outline.default.hex}}" }
desc = { fg = "{{colors.secondary.default.hex}}" }
separator_style = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }

[spot]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
tbl_col = { fg = "{{colors.primary.default.hex}}" }

[notify]
title_info = { fg = "{{colors.tertiary.default.hex}}" }
title_warn = { fg = "{{colors.secondary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border = { fg = "{{colors.outline.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }

[input]
border = { fg = "{{colors.outline.default.hex}}" }

[cmp]
border = { fg = "{{colors.outline.default.hex}}" }

[tasks]
border = { fg = "{{colors.outline.default.hex}}" }
hovered = { fg = "{{colors.primary.default.hex}}", bold = true }

[help]
border = { fg = "{{colors.outline.default.hex}}" }
chord = { fg = "{{colors.secondary.default.hex}}" }
