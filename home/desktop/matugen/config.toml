[config]
version_check = false

# Which color to choose if multiple good colors were found from an image.
# choices: [darkness, lightness, saturation, less-saturation, value, closest-to-fallback]
# The cli flag will override this if used.
prefer = "closest-to-fallback"

expr_prefix = "{{"
expr_postfix = "}}"

# Block is for stuff like for loops etc.
block_prefix = "<*"
block_postfix = "*>"

# Defaults to the contrast from CLI if unspecified.
# Value from -1 to 1.
# -1 represents minimum contrast, 0 represents standard (i.e. the design as spec'd),
# and 1 represents maximum contrast.
contrast = 0.5

# Will set the source color index just like the `--source-color-index` CLI flag (0 - 4).
# 0 = most dominant, 1 = 2nd most dominant, etc.
# IF the CLI flag is specified, it will override this value.
source_color_index = 0

# Fixed hues, harmonized toward the wallpaper. Used for the red/green/yellow
# accents in the starship prompt.
[config.custom_colors]
red    = "#e06c75"
green  = "#98c379"
yellow = "#e5c07b"

[config.wallpaper]
# Whether to set the wallpaper or not
set = true

# The base command to run for applying the wallpaper.
# Keywords like {{ image }} or anything that works inside of hooks works here.
# You could also set a static color if you use the color keywords and the wallpaper setter supports it.
command = "awww img --transition-type center {{ image }}; notify-send 'enjoy your new colorscheme :D'"

# For example, killing the wallpaper daemon. Usage is like a normal hook.
# pre_hook = ""

[templates.dunst]
input_path = "~/.config/matugen/templates/dunstrc"
output_path = "~/.config/dunst/dunstrc"
post_hook = "pkill dunst; dunst &"

[templates.foot]
input_path = "~/.config/matugen/templates/foot.ini"
output_path = "~/.config/foot/theme.ini"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/theme.ini"

[templates.niri]
input_path = "~/.config/matugen/templates/colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.waybar]
input_path = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.vesktop]
input_path = '~/.config/matugen/templates/discord.css'
output_path = '~/.config/vesktop/settings/quickCss.css'

[templates.equibop]
input_path = '~/.config/matugen/templates/discord.css'
output_path = '~/.config/equibop/settings/quickCss.css'

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.helix]
input_path = "~/.config/matugen/templates/helix.toml"
output_path = "~/.config/helix/themes/matugen.toml"
post_hook = "pkill -USR1 hx"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.tmux]
input_path = "~/.config/matugen/templates/tmux-colors.conf"
output_path = "~/.config/tmux/matugen-colors.conf"
post_hook = "tmux source-file ~/.config/tmux/matugen-colors.conf 2>/dev/null || true"

[templates.pywalfox]
input_path = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[templates.doom-emacs]
input_path = '~/.config/matugen/templates/matugen-theme.el'
output_path = '~/.config/doom/themes/matugen-theme.el'

[templates.emacs]
input_path = '~/.config/matugen/templates/matugen-theme.el'
output_path = '~/.emacs.d/matugen-theme.el'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.json'
output_path = '~/.config/quickshell/colors.json'
