# ── colors (generated by matugen) ─────────────────────────────
include colors.conf

# ── font ──────────────────────────────────────────────────────
font_family               MapleMono NF
bold_font                 auto
italic_font               auto
bold_italic_font          auto
font_size                 16.0
disable_ligatures         cursor
modify_font               cell_height 105%

# ── cursor + animations ───────────────────────────────────────
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_shape_unfocused    hollow
cursor_blink_interval     0.6 ease-in-out
cursor_stop_blinking_after 20

# smooth glide between cursor positions
cursor_trail              3
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2

# soft fade instead of a flash on bell
enable_audio_bell         no
visual_bell_duration      0.25 ease-out
window_alert_on_bell      yes
bell_on_tab               "● "

# ── window ────────────────────────────────────────────────────
background_opacity        1.00
dynamic_background_opacity yes
window_padding_width      20 20
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      110c
initial_window_height     32c

draw_minimal_borders      yes
window_border_width       1pt
inactive_text_alpha       0.75
placement_strategy        center

# ── tab bar ───────────────────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       round
tab_bar_min_tabs          2
tab_bar_margin_height     6 0
tab_title_max_length      24
tab_title_template        " {index} {title} "
active_tab_title_template " {index} {title}{' ●' if layout_name == 'stack' else ''} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# ── scrollback / behavior ─────────────────────────────────────
shell                     fish
scrollback_lines          10000
copy_on_select            clipboard
strip_trailing_spaces     smart
mouse_hide_wait           2.0
url_style                 curly
open_url_with             default
detect_urls               yes
shell_integration         enabled
allow_remote_control      socket-only
listen_on                 unix:/tmp/kitty-{kitty_pid}

# ── performance ───────────────────────────────────────────────
repaint_delay             6
input_delay               1
sync_to_monitor           yes

# ── keys ──────────────────────────────────────────────────────
map ctrl+alt+bracketright set_background_opacity +0.05
map ctrl+alt+bracketleft  set_background_opacity -0.05
map ctrl+alt+backslash    set_background_opacity default

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+z          toggle_layout stack

enabled_layouts           splits:split_axis=horizontal,stack
map ctrl+shift+r          load_config_file
